<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #080809; --surface: #111114; --elevated: #18181c; --subtle: #1e1e23;
    --border: #2a2a30; --border-2: #3a3a42;
    --text: #f0f0f4; --text-2: #c0c0cc; --muted: #808090; --faint: #505060;
    --brand: #00c8d4; --brand-dim: rgba(0,200,212,.12); --ai: #8b82ff;
    --ok: #34d399; --err: #ff4d4f; --warn: #fbbf24;
    --mono: ui-monospace, "Geist Mono", SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  header .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; font-family: var(--mono); }
  .board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 12px;
    padding: 16px 20px 40px; overflow-x: auto; }
  .col { min-width: 0; }
  .col h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 11px;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .col h2 .n { color: var(--faint); font-family: var(--mono); }
  .col h2 .arrow { color: var(--faint); margin-left: auto; }
  .col.needs-human h2 { color: var(--warn); }
  .lane { display: flex; flex-direction: column; gap: 10px; min-height: 120px; padding: 8px;
    border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
  .col.needs-human .lane { border-color: rgba(251,191,36,.35); }
  .empty { color: var(--faint); font-size: 12px; text-align: center; padding: 28px 0; }
  .card { text-align: left; width: 100%; color: inherit; font: inherit; cursor: pointer;
    background: var(--elevated); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; transition: border-color .15s, transform .15s; }
  .card:hover, .card:focus-visible { border-color: var(--brand); outline: none; transform: translateY(-1px); }
  .card .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .card .branch { font-family: var(--mono); font-size: 11px; color: var(--ai); overflow-wrap: anywhere; }
  .card .note { margin-top: 8px; font-size: 12px; color: var(--text-2); }
  .card.needs-human { border-color: var(--warn); background: linear-gradient(var(--elevated), var(--elevated)) padding-box,
    linear-gradient(135deg, var(--warn), transparent 60%) border-box; border: 1px solid transparent;
    box-shadow: 0 0 0 1px rgba(251,191,36,.25), 0 0 24px rgba(251,191,36,.12); }
  .card.needs-human .note { color: var(--warn); }
  .card.merged { opacity: .75; }
  .rounds { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 22px; }
  .chip { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px;
    border: 1px solid var(--border-2); color: var(--muted); background: transparent; }
  .chip.pending { border-style: dashed; animation: pulse 1.6s ease-in-out infinite; }
  .chip.PASS { color: #062; background: var(--ok); border-color: var(--ok); }
  .chip.CHANGES { color: #fff; background: var(--err); border-color: var(--err); }
  @keyframes pulse { 50% { opacity: .45; } }
  .stage-tag { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--brand); background: var(--brand-dim); padding: 1px 6px; border-radius: 999px; }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw);
    background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .22s ease; }
  aside.open { transform: none; }
  aside .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  aside .head h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  aside .close { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text-2);
    border-radius: 10px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; flex: none; }
  .tabs { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { flex: none; font: 12px var(--mono); color: var(--muted); background: var(--elevated);
    border: 1px solid var(--border); border-radius: 10px; padding: 4px 10px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--brand); background: var(--brand-dim); }
  .tab .v { margin-left: 6px; }
  .doc { padding: 16px 20px 40px; overflow-y: auto; color: var(--text-2); }
  .doc h1, .doc h2, .doc h3 { color: var(--text); margin: 18px 0 8px; line-height: 1.3; }
  .doc h1 { font-size: 18px; } .doc h2 { font-size: 15px; } .doc h3 { font-size: 14px; }
  .doc code { font-family: var(--mono); font-size: 12px; background: var(--subtle); padding: 1px 5px; border-radius: 6px; color: var(--text); }
  .doc pre { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow-x: auto; }
  .doc pre code { background: none; padding: 0; }
  .doc ul { padding-left: 20px; } .doc li { margin: 3px 0; }
  .doc .verdict { display: inline-block; font: 600 12px var(--mono); padding: 3px 10px; border-radius: 999px; margin-bottom: 4px; }
  .doc .verdict.good { background: rgba(52,211,153,.15); color: var(--ok); }
  .doc .verdict.bad { background: rgba(255,77,79,.15); color: var(--err); }
  .doc .verdict.esc { background: rgba(251,191,36,.15); color: var(--warn); }
  .demo-banner { font-size: 11px; color: var(--warn); border: 1px solid rgba(251,191,36,.4); border-radius: 999px; padding: 1px 8px; }
  @media (max-width: 720px) {
    header { padding: 12px 16px; flex-wrap: wrap; }
    header .meta { margin-left: 0; width: 100%; }
    .board { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 32px; overflow-x: visible; }
    .col h2 .arrow { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="polling board.json"></span>
  <h1>Software Factory</h1>
  <span class="demo-banner" id="demo" hidden>demo data</span>
  <span class="meta" id="meta">waiting for board.json…</span>
</header>
<main class="board" id="board"></main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" role="dialog" aria-label="Job files">
  <div class="head"><h3 id="d-title"></h3><button class="close" id="d-close" aria-label="Close">×</button></div>
  <div class="tabs" id="d-tabs" role="tablist"></div>
  <article class="doc" id="d-doc"></article>
</aside>

<script>
const STAGES = [
  ["spec", "Spec"], ["build", "Build"], ["review", "Review"],
  ["approve", "Approve"], ["merged", "Merged"], ["needs-human", "Needs human"],
];
const REVIEWERS = [["security", "SEC"], ["ux", "UX"], ["ui", "UI"], ["code", "CODE"]];
const DEMO = new URLSearchParams(location.search).has("demo");
let board = { jobs: [] }, lastRaw = "", openJob = null, openFile = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- data ---------- */
async function poll() {
  try {
    const raw = DEMO ? JSON.stringify(demoBoard()) : await (await fetch("board.json?t=" + Date.now(), { cache: "no-store" })).text();
    const parsed = JSON.parse(raw);            // keep last good state if this throws
    $("dot").classList.add("live");
    $("meta").textContent = `${parsed.jobs.length} job(s) · updated ${new Date().toLocaleTimeString()}`;
    if (raw !== lastRaw) { lastRaw = raw; board = parsed; render(); if (openJob) refreshDrawer(); }
  } catch { $("dot").classList.remove("live"); }
}
function roundsOf(job) {
  if (Array.isArray(job.rounds) && job.rounds.length) return job.rounds;
  return job.round ? [{ round: job.round, reviews: job.reviews || {} }] : [];
}

/* ---------- board ---------- */
function render() {
  $("board").innerHTML = STAGES.map(([key, label], i) => {
    const jobs = board.jobs.filter((j) => j.stage === key);
    return `<section class="col ${key}">
      <h2>${label} <span class="n">${jobs.length}</span>${i < 4 ? '<span class="arrow">→</span>' : ""}</h2>
      <div class="lane">${jobs.map(card).join("") || '<div class="empty">—</div>'}</div>
    </section>`;
  }).join("");
  document.querySelectorAll(".card").forEach((el) => el.onclick = () => openDrawer(el.dataset.id));
}
function card(j) {
  const rows = roundsOf(j).map((r) => `<div class="round"><span class="r">R${r.round}</span>${
    REVIEWERS.map(([k, short]) => { const v = (r.reviews || {})[k] || "pending"; return `<span class="chip ${esc(v)}" title="${k}: ${esc(v)}">${short}</span>`; }).join("")
  }</div>`).join("");
  const live = ["spec", "build", "approve"].includes(j.stage) ? ` <span class="stage-tag">${j.stage === "build" && j.round ? "rework" : "running"}</span>` : "";
  return `<button class="card ${esc(j.stage)}" data-id="${esc(j.id)}">
    <div class="id">${esc(j.id)}${live}</div>
    <div class="title">${esc(j.title || j.id)}</div>
    <div class="branch">${esc(j.branch)}</div>
    ${rows ? `<div class="rounds">${rows}</div>` : ""}
    ${j.note ? `<div class="note">${j.stage === "needs-human" ? "⚠ " : ""}${esc(j.note)}</div>` : ""}
  </button>`;
}

/* ---------- drawer ---------- */
function filesOf(j) {
  const f = [["spec.md", "spec"], ["build.md", "build"]];
  for (let k = 1; k <= 3; k++) f.push([`rework-${k}.md`, `rework ${k}`]);
  roundsOf(j).forEach((r) => REVIEWERS.forEach(([k, short]) =>
    f.push([`round-${r.round}/review-${k}.md`, `R${r.round} ${short}`, (r.reviews || {})[k]])));
  f.push(["decision.md", "decision"]);
  return f;
}
async function getFile(id, path) {
  if (DEMO) return DEMO_FILES[`${id}/${path}`] ?? null;
  try { const r = await fetch(`jobs/${encodeURIComponent(id)}/${path}?t=${Date.now()}`, { cache: "no-store" }); return r.ok ? await r.text() : null; }
  catch { return null; }
}
async function openDrawer(id) {
  openJob = id; openFile = null;
  $("drawer").classList.add("open"); $("scrim").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
  await refreshDrawer(); $("d-close").focus();
}
async function refreshDrawer() {
  const j = board.jobs.find((x) => x.id === openJob); if (!j) return closeDrawer();
  $("d-title").textContent = `${j.id} · ${j.title || ""}`;
  const files = filesOf(j);
  const texts = await Promise.all(files.map(([p]) => getFile(j.id, p)));
  const present = files.map((f, i) => [...f, texts[i]]).filter((f) => f[3] !== null);
  if (!present.length) { $("d-tabs").innerHTML = ""; $("d-doc").innerHTML = '<p class="empty">No files yet.</p>'; return; }
  if (!present.some((f) => f[0] === openFile)) openFile = present[0][0];
  $("d-tabs").innerHTML = present.map(([p, label, v]) =>
    `<button class="tab" role="tab" data-p="${esc(p)}" aria-selected="${p === openFile}">${esc(label)}${v && v !== "pending" ? `<span class="v">${v === "PASS" ? "✓" : "✕"}</span>` : ""}</button>`).join("");
  document.querySelectorAll(".tab").forEach((t) => t.onclick = () => { openFile = t.dataset.p; refreshDrawer(); });
  $("d-doc").innerHTML = md(present.find((f) => f[0] === openFile)[3]);
}
function closeDrawer() {
  openJob = null; $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true");
}
$("d-close").onclick = closeDrawer; $("scrim").onclick = closeDrawer;
addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

/* ---------- tiny markdown (escapes first; agent files are untrusted) ---------- */
function md(src) {
  const lines = esc(src).split("\n"); let out = "", inCode = false, inList = false;
  const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  lines.forEach((l, i) => {
    if (l.startsWith("```")) { out += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; return; }
    if (inCode) { out += l + "\n"; return; }
    if (/^\s*[-*] /.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] (\[[ x]\] )?/, (m, box) => box ? (box.includes("x") ? "☑ " : "☐ ") : ""))}</li>`; return; }
    if (inList) { out += "</ul>"; inList = false; }
    if (i === 0 && /^(VERDICT: PASS|APPROVE)\b/.test(l)) out += `<span class="verdict good">${l}</span>`;
    else if (i === 0 && /^(VERDICT: CHANGES)\b/.test(l)) out += `<span class="verdict bad">${l}</span>`;
    else if (i === 0 && /^ESCALATE\b/.test(l)) out += `<span class="verdict esc">${l}</span>`;
    else if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; }
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  });
  return out + (inList ? "</ul>" : "") + (inCode ? "</code></pre>" : "");
}

/* ---------- demo (dashboard.html?demo) ---------- */
function demoBoard() {
  const t = Math.floor(Date.now() / 3000) % 4;   // animate one job's chips filling in
  const live = ["pending", "pending", "pending", "pending"].map((v, i) => i < t ? (i === 2 && t > 2 ? "CHANGES" : "PASS") : v);
  return { jobs: [
    { id: "001-not-found-page", title: "Dark not-found page", branch: "factory/001-not-found-page", stage: "merged", round: 1,
      reviews: { security: "PASS", ux: "PASS", ui: "PASS", code: "PASS" },
      rounds: [{ round: 1, reviews: { security: "PASS", ux: "PASS", ui: "PASS", code: "PASS" } }] },
    { id: "002-sidebar-shortcut", title: "Cmd+B toggles sidebar", branch: "factory/002-sidebar-shortcut", stage: "needs-human", round: 2,
      note: "Adds a global key listener; product call on shortcut choice", reviews: { security: "PASS", ux: "PASS", ui: "PASS", code: "PASS" },
      rounds: [{ round: 1, reviews: { security: "PASS", ux: "CHANGES", ui: "PASS", code: "PASS" } }, { round: 2, reviews: { security: "PASS", ux: "PASS", ui: "PASS", code: "PASS" } }] },
    { id: "003-rate-limiting", title: "Rate limiting", branch: "factory/003-rate-limiting", stage: "review", round: 2,
      reviews: { security: live[0], ux: live[1], ui: live[2], code: live[3] },
      rounds: [{ round: 1, reviews: { security: "CHANGES", ux: "PASS", ui: "PASS", code: "CHANGES" } },
               { round: 2, reviews: { security: live[0], ux: live[1], ui: live[2], code: live[3] } }] },
    { id: "004-welcome-name", title: "Welcome back, name", branch: "factory/004-welcome-name", stage: "build", round: 0, rounds: [] },
  ] };
}
const DEMO_FILES = {
  "003-rate-limiting/spec.md": "# Rate limiting\n## Goal\nLimit generation requests per user.\n## Acceptance criteria\n- [ ] 11th request in a minute returns 429\n- [ ] `npm run lint` and `npm run build` pass",
  "003-rate-limiting/build.md": "# Build notes\n- Added `lib/rate-limit.ts`\n- AC1 verified with a curl loop\n## Round 2 fixes\n- Keyed limiter by `userId`, not IP",
  "003-rate-limiting/round-1/review-security.md": "VERDICT: CHANGES\n## Findings\n- **high** `lib/rate-limit.ts:12` keyed by IP; spoofable via `x-forwarded-for`. Key by Clerk `userId`.",
  "003-rate-limiting/round-1/review-code.md": "VERDICT: CHANGES\n## Findings\n- **medium** `lib/rate-limit.ts:4` uses `any` for the store.",
  "003-rate-limiting/round-1/review-ux.md": "VERDICT: PASS\nNot applicable: no UI in this diff.",
  "003-rate-limiting/round-1/review-ui.md": "VERDICT: PASS\nNot applicable: no UI in this diff.",
  "002-sidebar-shortcut/decision.md": "ESCALATE\n## Reason\nAdds a global key listener; product call on shortcut choice.\n## Risk\nCmd+B conflicts with browser bookmarks bar on some platforms.",
  "001-not-found-page/decision.md": "APPROVE\n## Reason\nAll ACs proven, all reviews PASS, scope respected.",
};

if (DEMO) $("demo").hidden = false;
poll(); setInterval(poll, DEMO ? 1000 : 2000);
</script>
</body>
</html>
